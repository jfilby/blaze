language = "typescript"
sourceFile = "cli.ts"
output = "machine"
backend = "machine"
mode = "debug"
# Every function has already passed the IR validator; interpreting each contract
# against random vectors is the slowest part of a self-build and is not the
# fixed point's oracle. The delivered compiler is still checked by stage 2.
verifyCandidates = false
benchmarkCandidates = false
workerProcesses = true

# The build has four cores; code generation is independent per function.
[generation]
functionConcurrency = 4

# A self-build runs the rules alone, so there is one candidate per function and
# no choice for a benchmark to make. Measuring every candidate 2000 times adds
# hours to a build of the whole compiler without changing the IR a fixed point
# compares; one iteration keeps the measurement and makes the build finish.
[benchmark]
iterations = 1

[model]
# provider = "nebius"
# model = "nvidia/Nemotron-3_5-Lightning"

[modules]
# The model transport a native build links. The Node compiler resolves
# "#host/model" through package.json to ai/review-node.ts, which carries the
# AI SDK; this project maps the same name to the adapter a native binary has.
"#host/model" = "ai/review-native.ts"
# The platform boundary. Node resolves "#host/platform" through package.json
# to core/platform-node.ts; the self-build links the adapter written in the
# subset, which answers the same names from the runtime's host ABI.
"#host/platform" = "core/platform-native.ts"
# The TOML parser alone: the package entry point also carries the writer, and
# the writer reads a host global the compiled runtime does not have.
"#host/toml" = "core/toml.ts"
